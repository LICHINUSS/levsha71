<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Помощь — Лавка Левши</title>
<meta name="description" content="Ответы на частые вопросы о «Лавке Левши»: установка, обновления, профиль, iPhone, друзья и группы.">
<meta name="theme-color" content="#1A0D07">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/store_icon_192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/site.css">
<style>
  .faq details { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 4px 16px; margin: 0 0 10px; }
  .faq summary { cursor: pointer; font-weight: 800; padding: 12px 0; list-style: none; display: flex; gap: 10px; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::before { content: "›"; color: var(--text2); transition: transform .15s; display: inline-block; }
  .faq details[open] summary::before { transform: rotate(90deg); }
  .faq .a { padding: 0 0 12px 18px; color: var(--text); }
  .faq .a p { margin: 0 0 8px; }
  .faq h2 { margin: 26px 0 12px; font-size: 22px; }
</style>
</head>
<body>
<a class="skip" href="#main">К содержимому · Skip to content</a>
<header class="top"><div class="wrap">
  <a class="brand" href="./"><img class="px" src="assets/stamp_256.png" alt=""><span data-i18n="brand">Лавка Левши</span></a>
  <nav class="nav">
    <a href="./#catalog" data-i18n="nav_catalog">Каталог</a>
    <a class="opt" href="people.html" data-i18n="nav_people">Люди</a>
    <a class="opt" href="help.html" data-i18n="nav_help" aria-current="page">Помощь</a>
    <a class="opt" href="ideas.html" data-i18n="nav_ideas">Идеи</a>
    <a href="me.html" data-i18n="nav_me">Моя лавка</a>
    <button class="lang" id="lang" title="Язык · Language">EN</button>
  </nav>
</div></header>

<main class="wrap" id="main" style="max-width:820px">
  <section class="faq">
    <h1 id="title">Помощь</h1>
    <p class="sub" id="sub"></p>
    <label class="search"><input id="q" type="search" autocomplete="off"></label>
    <div id="faq"></div>
    <p class="empty" id="none" hidden></p>
  </section>
</main>

<footer><div class="wrap">
  <img class="px" src="assets/stamp_256.png" alt="">
  <span data-i18n="footer">Подковано Левшой.</span>
  <a href="install.html" data-i18n="nav_install">Как установить</a>
  <a href="privacy.html" data-i18n="nav_privacy">Конфиденциальность</a>
</div></footer>

<script src="assets/site.js"></script>
<script>
"use strict";
// Вопросы и ответы. Ссылки внутри ответов — только на страницы этого сайта.
// Ответы — из каталога (content/help.json → catalog.json): те же, что в лавке на Android и iPhone.
const UI = { ru: { title: "Помощь", sub: "Ответы на частые вопросы. Не нашли свой — предложите в «Идеях и пожеланиях», мастер читает всё.",
                   q: "Найти ответ…", none: "Ничего не нашлось — попробуйте другое слово." },
             en: { title: "Help", sub: "Answers to common questions. Didn't find yours? Ask in Ideas & feedback — the master reads everything.",
                   q: "Find an answer…", none: "Nothing found — try another word." } };
const $ = id => document.getElementById(id);
function render() {
  const f = UI[Lavka.lang] || UI.ru, groups = (Lavka.catalog && Lavka.catalog.help) || [];
  $("title").textContent = f.title; $("sub").innerHTML = Lavka.esc(f.sub).replace("«Идеях и пожеланиях»", '<a href="ideas.html">«Идеях и пожеланиях»</a>').replace("Ideas &amp; feedback", '<a href="ideas.html">Ideas &amp; feedback</a>');
  $("q").placeholder = f.q; $("none").textContent = f.none;
  document.title = f.title + " — " + Lavka.t("brand");
  const q = $("q").value.trim().toLowerCase();
  let shown = 0;
  $("faq").innerHTML = groups.map(g => {
    const hit = g.items.filter(it => !q || (Lavka.L(it, "q") + Lavka.L(it, "a")).toLowerCase().includes(q));
    shown += hit.length;
    return hit.length ? `<h2>${Lavka.esc(Lavka.L(g, "title"))}</h2>` + hit.map(it =>
      `<details ${q ? "open" : ""}><summary>${Lavka.esc(Lavka.L(it, "q"))}</summary><div class="a">${Lavka.md(Lavka.L(it, "a"))}</div></details>`).join("") : "";
  }).join("");
  $("none").hidden = shown > 0 || !groups.length;
}
Lavka.init();
$("q").oninput = render;
render();  // заголовок и подсказка сразу — страница не «прыгает», пока грузятся ответы
document.addEventListener("lavka:lang", render);
Lavka.loadCatalog().then(() => { render(); jump(); });
// ссылка вида help.html#iphone открывает нужный раздел
function jump() {
  if (location.hash) setTimeout(() => { const h = [...document.querySelectorAll("#faq h2")].find(x => x.textContent.toLowerCase().includes(location.hash.slice(1))); if (h) h.scrollIntoView(); }, 50);
}
</script>
</body>
</html>
