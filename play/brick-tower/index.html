<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>Brick Tower</title>
		<!-- Своя стартовая страница «Кирпичной башни»: та же синяя пластина, что у заставки в игре, полоса из кирпичиков
		     и понятные слова (сколько скачано, что происходит дальше). Шаблон Godot: подстановки заполняет экспорт. -->
		<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: white; background-color: #1a6ae0; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }

#status {
	position: absolute; inset: 0;
	display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px;
	visibility: hidden;
	background-color: #1a6ae0;
	/* шипы пластины — как StudField в заставке игры */
	background-image:
		radial-gradient(circle at 44% 42%, rgba(255, 255, 255, .16) 0 5px, transparent 6px),
		radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .08) 0 9px, rgba(0, 0, 0, .14) 10px 11px, transparent 12px);
	background-size: 28px 28px;
	font-family: 'Noto Sans', 'Segoe UI', Roboto, Arial, sans-serif;
	padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#status-splash { width: min(30vh, 220px); height: auto; image-rendering: pixelated; }
#status-splash.show-image--false { display: none; }
#bt-title { font-weight: 800; font-size: clamp(22px, 4.2vh, 34px); letter-spacing: .04em; text-shadow: 0 3px 0 rgba(0, 0, 0, .25); }
#bt-bricks { display: flex; gap: 6px; }
#bt-bricks i {
	display: block; width: clamp(18px, 4.5vh, 30px); height: clamp(12px, 3vh, 20px);
	border-radius: 3px; background: rgba(0, 0, 0, .22); position: relative;
	transition: background-color .25s, transform .25s;
}
#bt-bricks i::before, #bt-bricks i::after {
	content: ""; position: absolute; top: -5px; width: 26%; height: 5px; border-radius: 2px 2px 0 0; background: inherit;
}
#bt-bricks i::before { left: 16%; }
#bt-bricks i::after { right: 16%; }
#bt-bricks i.on { transform: translateY(-2px); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .25); }
#bt-text { font-weight: 700; font-size: clamp(15px, 2.6vh, 20px); text-shadow: 0 2px 0 rgba(0, 0, 0, .25); min-height: 1.3em; }
#bt-hint { font-size: clamp(12px, 2vh, 15px); opacity: .85; max-width: 32em; text-align: center; margin: 0 16px; }
#status-notice {
	display: none; background-color: #5b3943; border-radius: .5rem; border: 1px solid #9b3943; color: #e0e0e0;
	line-height: 1.3; margin: 0 2rem; padding: 1rem; text-align: center; z-index: 1;
}
@media (prefers-reduced-motion: reduce) { #bt-bricks i { transition: none; } }
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="theme-color" content="#1a6ae0"><script>addEventListener('DOMContentLoaded',function(){if(!(matchMedia('(display-mode: standalone)').matches||navigator.standalone))return;var a=document.createElement('a');a.href='../../';a.textContent='‹ Лавка';a.style.cssText='position:fixed;left:10px;top:10px;z-index:9;padding:6px 12px;border-radius:99px;background:rgba(26,13,7,.75);color:#FBE2B8;font:700 15px sans-serif;text-decoration:none';document.body.appendChild(a)})</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--false use-filter--false" src="index.png" alt="">
			<div id="bt-title"></div>
			<div id="bt-bricks" aria-hidden="true"></div>
			<div id="bt-text" role="status" aria-live="polite"></div>
			<div id="bt-hint"></div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
// 3.0.2: экран с плотностью ×3 (iPhone) рисуем как ×2 — буферы кадра в 2,25 раза меньше; на глаз почти не видно,
// а память у вкладки на iPhone ограничена (~300–500 МБ), и Safari молча перезагружает тяжёлую страницу.
(function () {
	const real = window.devicePixelRatio || 1;
	// игра уже закрывалась сама (её память кончилась) — ещё бережнее: ×1,5 (ставит игра, scripts/game.gd)
	let low = false;
	try { low = localStorage.getItem('bt_lowmem') === '1'; } catch (e) { /* без хранилища */ }
	const cap = low ? 1.5 : 2;
	if (real > cap) {
		try { Object.defineProperty(window, 'devicePixelRatio', { get: () => cap, configurable: true }); } catch (e) { /* как есть */ }
	}
}());
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":5283376,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const RU = (navigator.language || 'ru').toLowerCase().startsWith('ru');
	const T = RU
		? { title: 'КИРПИЧНАЯ БАШНЯ', load: 'Загружаем игру… %d %', build: 'Собираем игру…',
			hint: 'Первый запуск в браузере — до полуминуты: игра скачивается и готовит картинку. В следующий раз будет быстрее.' }
		: { title: 'BRICK TOWER', load: 'Loading the game… %d %', build: 'Putting the game together…',
			hint: 'The first launch in a browser takes up to half a minute: the game downloads and prepares its graphics. Next time it is faster.' };
	// понятные слова, когда браузер не может запустить игру или потерял картинку
	const E = RU ? {
		nogl: 'Этот браузер не может показать 3D-картинку игры (нет WebGL 2).\n\nЧто помогает:\n'
			+ '• Яндекс Браузер: Настройки → Системные → Производительность → «Использовать аппаратное ускорение» (или найдите «аппаратное ускорение» поиском в настройках) — включить и перезапустить браузер.\n'
			+ '• Chrome: Настройки → Система → «Использовать графическое ускорение».\n'
			+ '• Обновите браузер; на компьютере — и драйвер видеокарты.\n'
			+ '• На телефоне Android игру проще поставить через «Лавку Левши».',
		other: 'Игре не хватило возможностей браузера:\n',
		lost: 'Картинка пропала — браузеру не хватило памяти. Закройте лишние вкладки и перезапустите игру.\nПрогресс сохранён.',
		again: 'Перезапустить',
		fail: 'Игра не запустилась. Обновите страницу; если не помогло — закройте лишние вкладки или откройте в другом браузере.\n',
	} : {
		nogl: 'This browser cannot show the game\'s 3D graphics (no WebGL 2).\n\nWhat helps:\n'
			+ '• Chrome / Yandex Browser: Settings → System → turn on hardware (graphics) acceleration and restart the browser.\n'
			+ '• Update the browser (on a computer, the graphics driver too).\n'
			+ '• On Android, install the game via Levsha\'s Shop.',
		other: 'The browser is missing features the game needs:\n',
		lost: 'The picture was lost — the browser ran out of memory. Close other tabs and restart the game.\nYour progress is saved.',
		again: 'Restart',
		fail: 'The game did not start. Reload the page; if that does not help, close other tabs or try another browser.\n',
	};
	const COLORS = ['#c91a09', '#f2cd37', '#0055bf', '#237841', '#fe8a18'];
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');
	const bricksBox = document.getElementById('bt-bricks');
	const text = document.getElementById('bt-text');
	document.getElementById('bt-title').textContent = T.title;
	document.getElementById('bt-hint').textContent = T.hint;
	const bricks = [];
	for (let i = 0; i < 10; i++) {
		const b = document.createElement('i');
		bricksBox.appendChild(b);
		bricks.push(b);
	}

	let initializing = true;
	let statusMode = '';

	// k — доля скачанного (0…1): кирпичики загораются по одному
	function setProgress(k) {
		const n = Math.round(k * bricks.length);
		bricks.forEach((b, i) => {
			const on = i < n;
			b.classList.toggle('on', on);
			b.style.backgroundColor = on ? COLORS[i % COLORS.length] : '';
		});
		text.textContent = k >= 1 ? T.build : T.load.replace('%d', Math.round(k * 100));
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(msg) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		msg.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(E.fail + err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice(E.fail);
		}
		setStatusMode('notice');
		document.getElementById('bt-hint').style.display = 'none';   // «первый запуск…» тут только путает
		initializing = false;
	}

	// браузер отнял картинку (чаще всего — не хватило памяти): вместо чёрного экрана — слова и кнопка
	document.getElementById('canvas').addEventListener('webglcontextlost', function () {
		const box = document.createElement('div');
		box.style.cssText = 'position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;'
			+ 'gap:16px;background:#1a6ae0;color:#fff;font:700 18px Arial,sans-serif;text-align:center;padding:24px;z-index:9';
		const p = document.createElement('div');
		p.style.whiteSpace = 'pre-line';
		p.textContent = E.lost;
		const b = document.createElement('button');
		b.textContent = E.again;
		b.style.cssText = 'font:800 20px Arial,sans-serif;padding:12px 28px;border:0;border-radius:10px;background:#f2cd37;color:#1b2a34';
		b.onclick = function () { location.reload(); };
		box.appendChild(p);
		box.appendChild(b);
		document.body.appendChild(box);
	});

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const gl = missing.some((m) => /webgl/i.test(m));
			displayFailureNotice(gl ? E.nogl : E.other + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		setProgress(0);
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					setProgress(Math.min(1, current / total));
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
