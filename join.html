<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Приглашение в группу — Лавка Левши</title>
<meta name="description" content="Приглашение в группу «Лавки Левши».">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1A0D07">
<link rel="icon" href="assets/store_icon_192.png">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="./"><img class="px" src="assets/stamp_256.png" alt=""><span data-i18n="brand">Лавка Левши</span></a>
  <nav class="nav"><button class="lang" id="lang" aria-label="Language">EN</button></nav>
</div></header>
<main class="wrap">
  <section style="max-width:560px;margin:0 auto;text-align:center">
    <img class="px" src="assets/mascot_happy.png" alt="" style="width:180px">
    <h1 data-i18n="join_title">Приглашение в группу</h1>
    <p data-i18n="join_text">Вас позвали в группу «Лавки Левши». Код:</p>
    <p id="code" style="font-size:36px;font-weight:900;letter-spacing:4px;color:var(--brick);margin:8px 0">— — —</p>
    <p style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <a class="btn" id="open" href="#" data-i18n="join_open">Открыть в лавке</a>
      <button class="btn ghost" id="copy" data-i18n="copy">Скопировать код</button>
    </p>
    <p class="muted" data-i18n="join_how"></p>
    <p class="muted"><span data-i18n="join_noapp">Лавки ещё нет? Сначала поставьте её:</span> <a href="install.html" data-i18n="how_link">Как установить</a></p>
  </section>
</main>
<script src="assets/site.js"></script>
<script>
"use strict";
// Ссылка вида …/join.html#КОД (код — 8 букв и цифр; на сервер отсюда ничего не уходит)
const code = (location.hash.slice(1).toUpperCase().match(/[A-Z0-9]{8}/) || [""])[0];
Lavka.init();
document.getElementById("code").textContent = code ? code.slice(0, 4) + " " + code.slice(4) : "— — —";
document.getElementById("open").href = code ? "levsha://group/" + code : "./";
document.getElementById("copy").onclick = async e => {
  try { await navigator.clipboard.writeText(code); e.target.textContent = Lavka.t("copied"); } catch (err) {}
};
if (Lavka.platform() === "ios") {
  document.getElementById("open").replaceWith(Object.assign(document.createElement("p"), { className: "muted", textContent: Lavka.t("join_ios") }));
}
if (code && Lavka.platform() === "android") setTimeout(() => { location.href = "levsha://group/" + code; }, 400);
</script>
</body>
</html>
